name: Publish Books

on:
  schedule:
    - cron: '17 5 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified edition (uncheck for a full review only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && !inputs.publish) && format('books-review-{0}', github.run_id) || 'books-publication' }}
  cancel-in-progress: false

env:
  TZ: UTC
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Draft releases are visible only to callers with push access. This job
    # reads metadata only; conversion runs separately with read permissions.
    permissions:
      contents: write
    outputs:
      build: ${{ steps.edition.outputs.build }}
      version: ${{ steps.edition.outputs.version }}
      artifact-id: ${{ steps.plan-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.12'
      - name: Plan edition
        id: edition
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        run: |
          if [[ "$VERIFY_ONLY" == 'true' ]]; then
            python scripts/release_books.py plan --verify-only
          else
            python scripts/release_books.py plan
          fi
      - name: Preserve the edition plan
        id: plan-artifact
        if: steps.edition.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wisdom-plan-${{ github.sha }}-${{ github.run_attempt }}
          path: builds/ebooks/Supporting files/release-plan.json
          if-no-files-found: error
          retention-days: 30

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.books-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact-id }}
          merge-multiple: true
          path: builds/ebooks/Supporting files/
      - name: Install pinned tools
        run: bash scripts/install_book_tools.sh
      - name: Check version and front-matter rules
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build all book formats
        env:
          EDITION: ${{ needs.plan.outputs.version }}
        run: |
          python scripts/build_books.py --version "$EDITION"
          python -m pip freeze > 'builds/ebooks/Supporting files/requirements.resolved.txt'
      - name: Validate EPUB and preserve manuscript content
        run: |
          java -jar 'builds/tools/Supporting files/epubcheck-5.4.0/epubcheck.jar' builds/ebooks/wisdom.epub --failonwarnings
          python scripts/validate_books.py
          python scripts/check_book_links.py
      - name: Verify reproducible books
        env:
          EDITION: ${{ needs.plan.outputs.version }}
        run: |
          python scripts/build_books.py --version "$EDITION" --output 'builds/ebooks/Supporting files/rebuild'
          for format in epub pdf html azw3 md json sqlite; do
            cmp "builds/ebooks/wisdom.$format" "builds/ebooks/Supporting files/rebuild/wisdom.$format"
          done
          rm -r 'builds/ebooks/Supporting files/rebuild'
      - name: Render actual EPUB chapter at reading widths
        run: |
          chapter=$(cat 'builds/ebooks/Supporting files/epub-preview-path.txt')
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --screenshot='builds/ebooks/Supporting files/rendered/epub-narrow.png' --window-size=390,844 "file://$chapter"
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --screenshot='builds/ebooks/Supporting files/rendered/epub-wide.png' --window-size=820,1000 "file://$chapter"
          copyright=$(cat 'builds/ebooks/Supporting files/epub-copyright-path.txt')
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --screenshot='builds/ebooks/Supporting files/rendered/epub-copyright-narrow.png' --window-size=390,844 "file://$copyright"
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --screenshot='builds/ebooks/Supporting files/rendered/epub-copyright-wide.png' --window-size=820,1000 "file://$copyright"
          html=$(realpath builds/ebooks/wisdom.html)
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --screenshot='builds/ebooks/Supporting files/rendered/html-narrow.png' --window-size=390,2600 "file://$html"
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --screenshot='builds/ebooks/Supporting files/rendered/html-wide.png' --window-size=1000,2400 "file://$html"
          kindle=$(cat 'builds/ebooks/Supporting files/kindle-preview-path.txt')
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --screenshot='builds/ebooks/Supporting files/rendered/kindle-preview.png' --window-size=600,1000 "file://$kindle#copyright-page"
      - name: Preserve books and review evidence
        id: books-artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wisdom-books-${{ github.sha }}-${{ github.run_attempt }}
          path: builds/ebooks/
          if-no-files-found: error
          retention-days: 30

  compatibility:
    needs: [plan, build]
    concurrency:
      group: wisdom-compatibility
      cancel-in-progress: false
    if: needs.plan.outputs.build == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preserve existing public URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_legacy.py

  publish:
    needs: [plan, build, compatibility]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.plan.outputs.build == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: builds/ebooks/
      - name: Attest the verified books and build record
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            builds/ebooks/wisdom.epub
            builds/ebooks/wisdom.pdf
            builds/ebooks/wisdom.html
            builds/ebooks/wisdom.azw3
            builds/ebooks/wisdom.md
            builds/ebooks/wisdom.json
            builds/ebooks/wisdom.sqlite
            builds/ebooks/edition.json
      - name: Publish the complete edition
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_books.py publish
