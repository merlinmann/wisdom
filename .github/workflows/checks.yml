name: Check Changes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.12'
      - name: Install the Markdown parser only
        run: bash scripts/install_book_tools.sh --checks-only
      - name: Check publication rules and source structure
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check manuscript and documentation links
        run: python scripts/check_book_links.py

  compatibility:
    needs: checks
    concurrency:
      group: wisdom-compatibility
      cancel-in-progress: false
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep existing reading links current
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_legacy.py
